version: '3.8'

services:
  # --- Database Layer ---
  mysql:
    image: mysql:8.0
    container_name: pos_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pos_db
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_pass
    ports:
      - "3306:3306"
    volumes:
      - pos_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pos_user", "-ppos_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # --- Backend Layer (Your Java App) ---
  backend:
    build: .
    container_name: resume-backend
    ports:
      - "8081:8080" # Maps laptop port 8081 (Cloudflare) to Java port 8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/pos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=pos_user
      - SPRING_DATASOURCE_PASSWORD=pos_pass
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

volumes:
  pos_mysql_data: