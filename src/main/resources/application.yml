spring:
  application:
    name: pos-backend

  datasource:
    url: jdbc:mysql://localhost:3306/pos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: pos_user
    password: pos_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Serve uploaded barcode images from local filesystem
  web:
    resources:
      static-locations: file:./uploads/, classpath:/static/

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Secret must be a Base64-encoded key of at least 256 bits (32 bytes).
# IMPORTANT: Change this value in production. Generate a strong key with:
#   openssl rand -base64 64
jwt:
  secret: UG9zU2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnRPbmx5Q2hhbmdlSW5Qcm9kdWN0aW9u
  expiration: 86400000   # 24 hours in milliseconds

# ─── Swagger ──────────────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ─── File storage ─────────────────────────────────────────────────────────────
app:
  upload-dir: ./uploads/barcodes

  # ─── CORS ─────────────────────────────────────────────────────────────────
  # Comma-separated list of allowed origins.
  # Development: localhost React dev server (Vite default 5173, CRA default 3000).
  # Production: replace with your actual domain(s), e.g. https://pos.example.com
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.pos: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
